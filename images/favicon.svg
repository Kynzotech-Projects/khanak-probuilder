<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Khanak ProBuild LLP favicon">
  <title>Khanak ProBuild LLP</title>

  <!-- Background: brand deep teal, rounded square -->
  <rect width="64" height="64" rx="12" fill="#0d3d36"/>

  <!-- Three building silhouettes — simplified for small sizes -->

  <!-- Left building -->
  <rect x="6"  y="32" width="14" height="24" rx="1" fill="none" stroke="#8fc0b8" stroke-width="2"/>

  <!-- Centre building (tallest) -->
  <rect x="25" y="16" width="14" height="40" rx="1" fill="none" stroke="#8fc0b8" stroke-width="2"/>

  <!-- Right building -->
  <rect x="44" y="24" width="14" height="32" rx="1" fill="none" stroke="#8fc0b8" stroke-width="2"/>

  <!-- Ground line -->
  <line x1="3" y1="57" x2="61" y2="57" stroke="#8fc0b8" stroke-width="2" stroke-linecap="round"/>
</svg>
