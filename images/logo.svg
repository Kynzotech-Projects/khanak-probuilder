  <rect x="48" y="70" width="8"  height="8"  rx="0.5" fill="none" stroke="#8fc0b8" stroke-width="1.4"/>
  <rect x="34" y="84" width="8"  height="8"  rx="0.5" fill="none" stroke="#8fc0b8" stroke-width="1.4"/>
  <rect x="48" y="84" width="8"  height="8"  rx="0.5" fill="none" stroke="#8fc0b8" stroke-width="1.4"/>

  <!-- Centre building (tallest) -->
  <rect x="70" y="30" width="42" height="74" rx="1" fill="none" stroke="#8fc0b8" stroke-width="2.2"/>
  <!-- Windows centre building -->
  <rect x="77" y="38" width="9"  height="9"  rx="0.5" fill="none" stroke="#8fc0b8" stroke-width="1.4"/>
  <rect x="92" y="38" width="9"  height="9"  rx="0.5" fill="none" stroke="#8fc0b8" stroke-width="1.4"/>
  <rect x="77" y="54" width="9"  height="9"  rx="0.5" fill="none" stroke="#8fc0b8" stroke-width="1.4"/>
  <rect x="92" y="54" width="9"  height="9"  rx="0.5" fill="none" stroke="#8fc0b8" stroke-width="1.4"/>
  <rect x="77" y="70" width="9"  height="9"  rx="0.5" fill="none" stroke="#8fc0b8" stroke-width="1.4"/>
  <rect x="92" y="70" width="9"  height="9"  rx="0.5" fill="none" stroke="#8fc0b8" stroke-width="1.4"/>
  <rect x="77" y="86" width="9"  height="9"  rx="0.5" fill="none" stroke="#8fc0b8" stroke-width="1.4"/>
  <rect x="92" y="86" width="9"  height="9"  rx="0.5" fill="none" stroke="#8fc0b8" stroke-width="1.4"/>

  <!-- Right building (medium) -->
  <rect x="122" y="46" width="36" height="58" rx="1" fill="none" stroke="#8fc0b8" stroke-width="2.2"/>
  <!-- Windows right building -->
  <rect x="128" y="54" width="8"  height="8"  rx="0.5" fill="none" stroke="#8fc0b8" stroke-width="1.4"/>
  <rect x="142" y="54" width="8"  height="8"  rx="0.5" fill="none" stroke="#8fc0b8" stroke-width="1.4"/>
  <rect x="128" y="68" width="8"  height="8"  rx="0.5" fill="none" stroke="#8fc0b8" stroke-width="1.4"/>
  <rect x="142" y="68" width="8"  height="8"  rx="0.5" fill="none" stroke="#8fc0b8" stroke-width="1.4"/>
  <rect x="128" y="82" width="8"  height="8"  rx="0.5" fill="none" stroke="#8fc0b8" stroke-width="1.4"/>
  <rect x="142" y="82" width="8"  height="8"  rx="0.5" fill="none" stroke="#8fc0b8" stroke-width="1.4"/>

