<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" role="img" aria-label="Khanak ProBuild LLP logo mark — three building silhouettes on deep teal background">
  <title>Khanak ProBuild LLP</title>

  <!-- Background: brand deep teal -->
